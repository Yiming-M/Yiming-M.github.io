tldr:
  en: "Adversarial realism and cycle reconstruction do not verify that a synthetic medical image keeps its label and actually reaches the target domain; TACIT freezes leakage-aware task and domain validators, uses them to guide a counterfactual renderer, and keeps only images both validators accept, reaching 96.04% held-out test accuracy on the cross-hospital Camelyon17-WILDS benchmark."
  zh: "对抗真实感和循环重建都无法检验一张合成的医学图像是否保留了原标签、是否真的到达了目标域；TACIT 冻结考虑信息泄漏的任务验证器和域验证器，用它们引导反事实渲染器，并只保留两个验证器都认可的图像，在跨医院的 Camelyon17-WILDS 病理基准上达到 96.04% 的留出测试准确率。"
abstract:
  en: "AI-based medical image analysis models often degrade under shifts in acquisition protocol, scanner, staining, or clinical site. Synthetic cross-domain augmentation may mitigate this degradation, but an augmented image is useful as labeled data only if it both preserves source task semantics and matches the requested target-domain appearance. Standard translation objectives, such as adversarial realism and cycle reconstruction, do not directly verify these two properties. To address this gap, we introduce TACIT, a Task-Aware Counterfactual Image Translation framework for audit-first medical augmentation. TACIT first trains leakage-aware task and domain validators, selects low-leakage checkpoints, and freezes the selected validators. The frozen validators supervise a source-start renderer with task-preservation and domain-arrival losses, using same-label target styles from task-conditioned codebooks or references. Candidates generated by the renderer are added to downstream training only if the frozen validators predict both source-label preservation and requested target-domain arrival. We evaluate TACIT on the cross-hospital Camelyon17-WILDS histopathology benchmark, with an additional downstream whole-prostate MRI evaluation on PI-CAI. Multi-seed cross-validator audits show that task-preservation loss, domain-arrival loss, and same-label routing address complementary failure modes. In downstream out-of-distribution classification, validator-filtered TACIT reaches 96.04±0.40% held-out test accuracy on Camelyon17-WILDS, comparable to strong domain-generalization baselines. These results support evaluating synthetic medical augmentation in terms of both task and domain validity, rather than visual plausibility alone."
  zh: "基于 AI 的医学图像分析模型在采集协议、扫描设备、染色或临床中心发生变化时，性能常常下降。合成跨域增强可能缓解这种下降，但一张增强图像只有在既保留源任务语义、又符合所要求的目标域外观时，才能作为有标签数据使用。对抗真实感、循环重建等标准翻译目标并不直接检验这两个性质。为弥补这一空白，我们提出 TACIT，一个面向“先审核”医学增强的任务感知反事实图像翻译（Task-Aware Counterfactual Image Translation）框架。TACIT 首先训练考虑信息泄漏的任务验证器和域验证器，选择泄漏低的检查点，并冻结选中的验证器。冻结的验证器通过任务保持损失和域到达损失监督一个从源图像出发的渲染器，所用的目标风格来自同标签的任务条件码本或参考图像。渲染器生成的候选图像，只有在冻结的验证器同时预测源标签得以保持、并已到达所要求的目标域时，才会加入下游训练。我们在跨医院的 Camelyon17-WILDS 病理基准上评估 TACIT，并在 PI-CAI 上额外做了全前列腺 MRI 的下游评估。多随机种子的交叉验证器审核表明，任务保持损失、域到达损失和同标签路由分别应对互补的失效模式。在下游的分布外分类中，经验证器筛选的 TACIT 在 Camelyon17-WILDS 上达到 96.04±0.40% 的留出测试准确率，与强有力的域泛化基线相当。这些结果支持从任务有效性和域有效性两方面、而不仅仅从视觉可信度来评估合成医学增强。"
